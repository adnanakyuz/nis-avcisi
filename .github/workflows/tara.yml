# Günde 1 kez (ve istendiğinde) YouTube'u tarar, raporu GitHub Pages'te yayınlar.
# Elle çalıştırmak için: GitHub → Actions → "Niş taraması" → Run workflow.
name: Niş taraması

on:
  schedule:
    - cron: "17 4 * * *"   # her gün Türkiye saatiyle 07:17 → ~4.750 birim; kalan ~5.200 elle konu aramalarına (~3 konu)
  workflow_dispatch:
    inputs:
      konu:
        description: "Konu (virgülle ayır, ör: tarih, borsa, kripto). Boş = genel tarama"
        required: false
        default: ""
      dil:
        description: "Dil"
        type: choice
        options: [Global, Türkçe]
        default: Global

permissions:
  contents: write   # geçmiş veritabanını depoya geri kaydetmek için
  pages: write
  id-token: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tara
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          KONU: ${{ inputs.konu }}   # komut satırına doğrudan yazılmaz; ortam değişkeniyle güvenli aktarılır
          DIL: ${{ inputs.dil }}
        # Konu boşsa genel tarama (site/index.html), doluysa konu sayfası (site/konu/...).
        run: |
          EK=""
          if [ "$DIL" = "Türkçe" ]; then EK="--bolge TR --dil tr"; fi
          python -u nis_avcisi.py --konu "$KONU" $EK --site site --db nis_gecmis.db

      - name: Geçmişi ve sayfaları kaydet
        run: |
          git config user.name "nis-avcisi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nis_gecmis.db site
          git diff --cached --quiet || git commit -m "Tarama $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: yayin
        uses: actions/deploy-pages@v5
